<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My firstPortfolio</title>
    <style>
      body {
        margin: 0;
        padding: 0;

        nav {
          background-color: #df6f6f;
          color: #fff;
          flex-direction: row;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 50px;
          height: 50px;
          a {
            color: #fff;
            text-decoration: none;
            background-color: #351b1b;
            width: 8%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
          }
          a:hover {
            background-color: #ffffff;
            color: #000;
          }
          a:active {
            background-color: #000000;
            color: #fff;
          }
        }

        main {
          background-color: #f0d8d8;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          section {
            gap: 15px;
            background-color: #fff;
            border-radius: 25px;
            padding: 20px;
            display: grid;
            grid-template-columns: 200px 200px 200px;
            grid-template-rows: 200px 200px;
            grid-template-areas:
              "a a c c"
              "b b c c";
            .item1 {
              grid-area: a;
              font-size: 60px;
              border-radius: 10px;
              height: 70%;
              background-color: #ff00001a;
              padding: 4px;
            }
            .item2 {
              grid-area: b;
              font-size: 20px;
              border-radius: 10px;
              background-color: #ff00001a;
              padding: 10px;
            }
            .item3 {
              grid-area: c;
              border-radius: 50px;
              border: 1px solid #000;
            }
          }
        }
        footer {
          color: white;
          background-color: #351b1b;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/MyPractive/about.html">About Me</a>
        <a href="/MyPractive/skills.html">Skills</a>
        <a href="/MyPractive/projects.html">Projects</a>
        <a href="/MyPractive/contacts.html">Contact</a>
      </nav>
    </header>
    <main>
      <section>
        <h1 class="item1">Hi, ARJAY</h1>
        <p class="item2">Ang pinaka <b>Masarap</b> na nakilala mo.</p>
        <img
          class="item3"
          src="/myAnime.png"
          alt="Profile Picture"
          title="ME!"
          width="auto"
          height="400"
        />
      </section>
    </main>
    <footer>@2026 gawa ni ponce.</footer>
  </body>
</html>
